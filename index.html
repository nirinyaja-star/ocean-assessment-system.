<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบประเมินพฤติกรรมการทำงาน</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin:0 auto;padding:16px;color:#1a1a1a;background:#fafafa}
  .bar{height:8px;background:#e2e2e2;border-radius:4px;overflow:hidden;margin-bottom:8px}
  .bar>div{height:100%;background:#1f4e79;transition:width .2s}
  .progress-label{font-size:13px;color:#555;margin-bottom:20px}
  .q{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:20px;margin-bottom:12px}
  .q h2{font-size:16px;margin:0 0 14px}
  label{display:block;border:1px solid #ddd;border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
  label:hover{background:#f4f8fb}
  label.selected{border-color:#1f4e79;background:#eaf1f8}
  input[type=radio]{margin-right:8px}
  .nav{display:flex;justify-content:space-between;margin-top:16px}
  button{padding:10px 18px;border:none;border-radius:6px;background:#1f4e79;color:#fff;font-size:14px;cursor:pointer}
  button.secondary{background:#999}
  button:disabled{background:#ccc;cursor:not-allowed}
  .intro,.review,.done{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:24px}
  .review-item{border-bottom:1px solid #eee;padding:10px 0;font-size:14px}
  .review-item .ans{color:#1f4e79;font-weight:600}
  .err{color:#b00020;font-size:13px;margin-top:8px}
  input[type=text],input[type=email]{width:100%;padding:8px;margin:6px 0 12px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
  .section-tag{display:inline-block;font-size:11px;background:#eef;color:#334;padding:2px 8px;border-radius:10px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DRAFT_KEY = 'candidate-assessment-draft-v1';
let QUESTIONS = [], META = {};
let state = { step: 'intro', current: 0, answers: {}, candidateName: '', candidateEmail: '' };

function loadDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state = Object.assign(state, d);
    }
  } catch (e) { /* localStorage unavailable or corrupt draft — start fresh */ }
}
function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}
function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
}

function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render() {
  const app = document.getElementById('app');
  if (state.step === 'intro') {
    app.innerHTML = `
      <div class="intro">
        <h1>แบบประเมินพฤติกรรมการทำงาน</h1>
        <p>แบบประเมินนี้มี ${QUESTIONS.length} ข้อ ใช้เวลาประมาณ 15-20 นาที คำตอบของคุณจะถูกบันทึกอัตโนมัติในเครื่อง คุณสามารถออกแล้วกลับมาทำต่อได้ และตรวจสอบ/แก้ไขคำตอบได้ก่อนส่งจริง</p>
        <label>ชื่อ-นามสกุล <input type="text" id="name" value="${esc(state.candidateName)}"></label>
        <label>อีเมล (ถ้ามี) <input type="email" id="email" value="${esc(state.candidateEmail)}"></label>
        <div id="introErr" class="err"></div>
        <button onclick="startAssessment()">เริ่มทำแบบประเมิน</button>
      </div>`;
    return;
  }
  if (state.step === 'question') {
    const i = state.current;
    const q = QUESTIONS[i];
    const pct = Math.round((Object.keys(state.answers).length / QUESTIONS.length) * 100);
    app.innerHTML = `
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="progress-label">ข้อ ${i+1} / ${QUESTIONS.length} · ตอบแล้ว ${Object.keys(state.answers).length} ข้อ</div>
      <div class="q">
        <span class="section-tag">${q.kind === 'ocean' ? 'สถานการณ์การทำงาน' : 'มุมมองต่อการทำงาน'}</span>
        <h2>${esc(q.text)}</h2>
        ${q.options.map((opt, oi) => `
          <label class="${state.answers[q.questionId]===oi?'selected':''}">
            <input type="radio" name="opt" value="${oi}" ${state.answers[q.questionId]===oi?'checked':''} onchange="selectOption('${q.questionId}', ${oi})">
            ${esc(opt)}
          </label>`).join('')}
      </div>
      <div class="nav">
        <button class="secondary" onclick="prevQuestion()" ${i===0?'disabled':''}>ก่อนหน้า</button>
        <button onclick="nextQuestion()">${i === QUESTIONS.length-1 ? 'ตรวจสอบคำตอบทั้งหมด' : 'ถัดไป'}</button>
      </div>`;
    return;
  }
  if (state.step === 'review') {
    const missing = QUESTIONS.filter(q => state.answers[q.questionId] == null);
    app.innerHTML = `
      <div class="review">
        <h1>ตรวจสอบคำตอบก่อนส่ง</h1>
        ${missing.length ? `<div class="err">ยังตอบไม่ครบ ${missing.length} ข้อ กรุณากลับไปตอบให้ครบก่อนส่ง</div>` : '<p>ตอบครบทุกข้อแล้ว คุณสามารถแก้ไขคำตอบใดก็ได้ก่อนส่งจริง</p>'}
        ${QUESTIONS.map((q, i) => `
          <div class="review-item">
            <div>${i+1}. ${esc(q.text)}</div>
            <div class="ans">${state.answers[q.questionId]!=null ? esc(q.options[state.answers[q.questionId]]) : '(ยังไม่ตอบ)'}
              <a href="#" onclick="editQuestion(${i});return false;" style="margin-left:8px;font-weight:normal;font-size:12px">แก้ไข</a>
            </div>
          </div>`).join('')}
        <div id="submitErr" class="err"></div>
        <div class="nav">
          <button class="secondary" onclick="state.step='question'; state.current=${QUESTIONS.length-1}; render();">กลับไปแก้ไข</button>
          <button onclick="submitAssessment()" ${missing.length?'disabled':''}>ส่งคำตอบ</button>
        </div>
      </div>`;
    return;
  }
  if (state.step === 'submitting') {
    app.innerHTML = `<div class="done"><h1>กำลังส่งคำตอบ...</h1><p>กรุณารอสักครู่</p></div>`;
    return;
  }
  if (state.step === 'done') {
    app.innerHTML = `
      <div class="done">
        <h1>ส่งคำตอบสำเร็จ</h1>
        <p>ขอบคุณที่ทำแบบประเมินจนเสร็จสมบูรณ์ ทีมงานจะติดต่อกลับหากมีการนัดสัมภาษณ์เพิ่มเติม</p>
        <p style="font-size:13px;color:#777">หมายเลขอ้างอิง: ${esc(state.localId || '-')}</p>
        <p><a href="/api/export/${esc(state.localId)}?format=pdf" target="_blank">ดาวน์โหลดคำตอบของฉัน (PDF)</a> ·
           <a href="/api/export/${esc(state.localId)}?format=docx" target="_blank">DOCX</a> ·
           <a href="/api/export/${esc(state.localId)}?format=csv" target="_blank">CSV</a> ·
           <a href="/api/export/${esc(state.localId)}?format=json" target="_blank">JSON</a></p>
      </div>`;
    return;
  }
}

function startAssessment() {
  const name = document.getElementById('name').value.trim();
  if (!name) { document.getElementById('introErr').textContent = 'กรุณากรอกชื่อ-นามสกุล'; return; }
  state.candidateName = name;
  state.candidateEmail = document.getElementById('email').value.trim();
  state.step = 'question';
  state.current = state.current || 0;
  saveDraft();
  render();
}

function selectOption(questionId, optionIndex) {
  state.answers[questionId] = optionIndex;
  saveDraft();
  render();
}

function nextQuestion() {
  if (state.current < QUESTIONS.length - 1) { state.current++; } else { state.step = 'review'; }
  saveDraft();
  render();
}
function prevQuestion() {
  if (state.current > 0) state.current--;
  saveDraft();
  render();
}
function editQuestion(i) {
  state.step = 'question';
  state.current = i;
  saveDraft();
  render();
}

async function submitAssessment() {
  state.step = 'submitting';
  render();
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ candidateName: state.candidateName, candidateEmail: state.candidateEmail, answers: state.answers }),
    });
    const body = await res.json();
    if (res.status !== 202) {
      state.step = 'review';
      render();
      document.getElementById('submitErr').textContent = 'ส่งไม่สำเร็จ: ' + (body.error ? body.error.message : 'unknown error');
      return;
    }
    state.localId = body.localId;
    state.step = 'done';
    clearDraft();
    render();
  } catch (e) {
    state.step = 'review';
    render();
    document.getElementById('submitErr').textContent = 'เครือข่ายขัดข้อง: ' + e.message;
  }
}

async function init() {
  const res = await fetch('/questions.json');
  const data = await res.json();
  QUESTIONS = data.questions;
  META = { assessmentVersion: data.assessmentVersion, questionBankHash: data.questionBankHash };
  loadDraft();
  render();
}
init();
</script>
</body>
</html>
